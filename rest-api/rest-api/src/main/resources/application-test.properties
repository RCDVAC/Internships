# ==================== TEST PROFILE CONFIGURATION ====================

# DevServices PostgreSQL (automatic Testcontainers)
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=postgres:16-alpine
quarkus.datasource.devservices.db-name=postgres
quarkus.datasource.devservices.init-script-path=init-schema.sql

# Hibernate for tests - create tables and load import.sql
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.create-schemas=true

# Disable security (per user request)
quarkus.http.auth.permission.permit1.paths=/*
quarkus.http.auth.permission.permit1.policy=permit

# Logging
quarkus.log.category."bg.softlytic".level=DEBUG
